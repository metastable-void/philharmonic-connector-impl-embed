[package]
name = "philharmonic-connector-impl-embed"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MPL-2.0"
readme = "README.md"
repository = "https://github.com/metastable-void/philharmonic-connector-impl-embed"
description = "Embedding connector implementation for Philharmonic (embed capability: text in, vector out)."

[features]
default = ["bundled-default-model"]
bundled-default-model = []

[dependencies]
async-trait = { version = "0.1", default-features = false, features = [] }
inline-blob = "0.1"
ndarray = { version = "0.16", default-features = false, features = ["std"] }
philharmonic-connector-common = "0.2"
philharmonic-connector-impl-api = "0.1"
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "time"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
tract-onnx = { version = "0.22.1", default-features = false, features = [] }

[build-dependencies]
dirs = { version = "6", default-features = false, features = [] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }
ureq = { version = "3.3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }

[dev-dependencies]
approx = { version = "0.5", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
no-default-features = true

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
overflow-checks = true
